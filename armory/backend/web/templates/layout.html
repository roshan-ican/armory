{{define "layout"}}<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark">
  <title>{{.Title}} · Armory</title><link rel="stylesheet" href="/static/styles.css"><script src="/static/htmx.min.js"></script>
</head><body>
  <header class="topbar">
    <a class="brand" href="/guns">Armory</a>
    <nav class="nav" aria-label="Primary navigation">
      <a href="/guns" {{if eq .Title "Guns"}}class="active" aria-current="page"{{end}}>Firearms</a>
      <a href="/lockers" {{if eq .Title "Lockers"}}class="active" aria-current="page"{{end}}>Lockers</a>
      <a href="/categories" {{if eq .Title "Categories"}}class="active" aria-current="page"{{end}}>Categories</a>
    </nav>
    <span class="system-status"><i></i>Online</span>
  </header>
  <main>{{template "content" .}}</main>
</body></html>{{end}}
