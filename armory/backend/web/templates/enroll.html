{{define "enroll"}}<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Request face enrollment · Armory</title><link rel="stylesheet" href="/static/styles.css">
</head><body class="kiosk">
  <header class="kiosk-bar"><a class="brand" href="/kiosk">Armory</a></header>
  <main class="kiosk-main"><section class="kiosk-stage">
    <h1>Enroll yourself</h1>
    <p class="kiosk-sub">Enter your details, then use this tablet's camera. An admin must approve you before your face will work.</p>
    <div class="form-grid enrollment-identity"><input id="name" placeholder="Full name" autocomplete="name" required><input id="service-no" placeholder="Service number" autocomplete="off" required></div>
    <div class="face-frame" id="face-frame"><video id="cam" playsinline muted></video></div>
    <p id="status" class="camera-status">Loading camera…</p>
    <button id="capture" class="button-primary" type="button" disabled>Send enrollment request</button>
    <p><a class="button-link" href="/kiosk">Back</a></p>
  </section></main>
  <script src="/static/face/face-api.js"></script><script src="/static/face/capture.js"></script>
  <script>
    (async () => {
      const video = document.getElementById("cam"), status = document.getElementById("status"), capture = document.getElementById("capture");
      const say = (message, bad = false) => { status.textContent = message; status.className = "camera-status" + (bad ? " bad" : ""); };
      try { await armoryFace.load(); await armoryFace.start(video); document.getElementById("face-frame").classList.add("is-live"); capture.disabled = false; say("Face the camera, then send your request."); }
      catch (e) { say(e.message || "The camera is not available.", true); return; }
      capture.addEventListener("click", async () => {
        const name = document.getElementById("name").value.trim(), serviceNo = document.getElementById("service-no").value.trim();
        if (!name || !serviceNo) { say("Enter your name and service number first.", true); return; }
        capture.disabled = true; say("Capturing…");
        try {
          const descriptors = [];
          for (let i = 0; i < 3; i++) { const d = await armoryFace.descriptor(video); if (d) descriptors.push(Array.from(d)); await armoryFace.sleep(180); }
          if (descriptors.length < 2) throw new Error("Could not see your face clearly. Try again in good light.");
          await armoryFace.post("/enroll", { name, service_no: serviceNo, descriptors });
          armoryFace.stop(video); say("Request sent. An admin must approve it before you can sign in."); capture.hidden = true;
        } catch (e) { say(e.message || "Could not send the request.", true); capture.disabled = false; }
      });
    })();
  </script>
</body></html>{{end}}
